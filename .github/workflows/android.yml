name: Android in Browser

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # safety net: restarts it if the chain ever breaks

concurrency:
  group: android
  cancel-in-progress: false  # next run waits for this one, never kills it

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      ISSUE: "1"
    steps:
      - name: Mark start
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install desktop + VNC + noVNC
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb x11vnc novnc websockify fluxbox libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libgl1 libx11-xcb1 libxdamage1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start virtual display
        run: |
          nohup Xvfb :99 -screen 0 900x1150x24 > xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:99 nohup fluxbox > fluxbox.log 2>&1 &
          sleep 1

      - name: Write session script
        run: |
          cat > session.sh <<'EOF'
          #!/usr/bin/env bash
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export DISPLAY=:99
          PW="${VNC_PASSWORD:-android}"
          x11vnc -display :99 -passwd "$PW" -forever -shared -rfbport 5900 -noxdamage -bg -o x11vnc.log
          nohup websockify --web /usr/share/novnc 6080 localhost:5900 > websockify.log 2>&1 &
          nohup ./cloudflared tunnel --url http://localhost:6080 --no-autoupdate > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          adb shell settings put system screen_off_timeout 2147483647
          adb shell svc power stayon true
          LINK="$URL/vnc.html?autoconnect=true&resize=scale"
          echo "LINK: $LINK"
          printf '### Android link\n%s\n' "$LINK" >> "$GITHUB_STEP_SUMMARY"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**Link:** $LINK

          Password: ${VNC_PASSWORD:+the VNC_PASSWORD secret}${VNC_PASSWORD:-android}. Started: $(date -u). Auto-restarts before the 6h limit."
          DISPATCH=$((START + 330*60)); END=$((START + 354*60)); SENT=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ "$SENT" = 0 ] && [ "$(date +%s)" -ge "$DISPATCH" ]; then
              gh workflow run android.yml --repo "$GITHUB_REPOSITORY" && SENT=1
            fi
            adb get-state >/dev/null 2>&1 || { echo "emulator died"; break; }
            sleep 30
          done
          [ "$SENT" = 0 ] && gh workflow run android.yml --repo "$GITHUB_REPOSITORY"
          echo done
          EOF
          chmod +x session.sh

      - name: Run Android emulator + VNC + public link
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ":99"
        with:
          api-level: 30
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_2
          ram-size: 3072M
          disk-size: 8G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -scale 0.8 -memory 3072 -cores 3
          script: bash session.sh

      - name: Logs on failure
        if: always()
        run: |
          for f in xvfb.log x11vnc.log websockify.log cf.log; do echo "--- $f"; tail -n 20 $f 2>/dev/null; done
