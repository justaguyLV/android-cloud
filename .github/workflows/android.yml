name: Android in Browser

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # safety net: restarts it if the chain ever breaks

concurrency:
  group: android
  cancel-in-progress: false  # next run waits for this one, never kills it

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      ISSUE: "1"
    steps:
      - name: Mark start
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install desktop + VNC + noVNC
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb x11vnc novnc websockify fluxbox libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libgl1 libx11-xcb1 libxdamage1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libasound2t64
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Build ws-scrcpy (touch UI for the phone)
        run: |
          git clone --depth 1 https://github.com/NetrisTV/ws-scrcpy ws-scrcpy
          cd ws-scrcpy
          npm install --no-audit --no-fund
          npm run dist:prod
          cd dist && npm install --omit=dev --no-audit --no-fund
          ls

      - name: Install Android 64-bit image (Google Play)
        run: |
          exec > >(tee install.log) 2>&1
          set -x
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          set +e +o pipefail
          yes | "$SM" --sdk_root="$SDK" --licenses > lic.log 2>&1
          yes | "$SM" --sdk_root="$SDK" --install "emulator" "platform-tools" "system-images;android-30;google_apis_playstore;x86_64" > sm.log 2>&1
          echo "sdkmanager exit: $?"
          tail -n 15 sm.log
          ls "$SDK/system-images/android-30/google_apis_playstore/" || { echo "IMAGE MISSING"; exit 1; }
          ls "$SDK/emulator/emulator" || { echo "EMULATOR MISSING"; exit 1; }
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "no" | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n play -k "system-images;android-30;google_apis_playstore;x86_64" -d pixel_2 --force
          CFG="$ANDROID_AVD_HOME/play.avd/config.ini"
          ls "$CFG" || { echo "AVD NOT CREATED"; ls -R "$HOME/.android" "$HOME/.config/.android" 2>&1 | head -30; exit 1; }
          sed -i '/^hw.ramSize/d;/^hw.lcd/d;/^hw.keyboard/d;/^hw.gpu/d;/^disk.dataPartition.size/d' "$CFG"
          cat >> "$CFG" <<CFG
          hw.ramSize=3072
          hw.lcd.width=540
          hw.lcd.height=960
          hw.lcd.density=240
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          disk.dataPartition.size=8G
          CFG
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Report failure
        if: failure()
        run: |
          echo "::error title=install-log::$(tail -n 25 install.log 2>&1 | tr '\n' '|' | cut -c1-3000)"
          echo "::error title=sdk-env::SDK=$SDK ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT $(ls $ANDROID_HOME/cmdline-tools 2>&1 | tr '\n' ' ')"

      - name: Start emulator
        run: |
          nohup "$SDK/emulator/emulator" -avd play -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 4 > emu.log 2>&1 &
          export PATH="$SDK/platform-tools:$PATH"
          sleep 20
          pgrep -a emulator || echo "EMULATOR PROCESS NOT RUNNING"
          if ! timeout 180 adb wait-for-device; then
            echo "::error title=adb-timeout::$(tail -n 30 emu.log | tr '\n' '|' | cut -c1-3000)"
            echo "--- emu.log"; cat emu.log; ls -l /dev/kvm; exit 1
          fi
          BOOTED=0
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && { BOOTED=1; break; }
            sleep 5
          done
          [ "$BOOTED" = 1 ] || { echo "::error title=boot-timeout::$(tail -n 30 emu.log | tr '\n' '|' | cut -c1-3000)"; exit 1; }
          adb shell settings put system screen_off_timeout 2147483647
          adb shell svc power stayon true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "booted"

      - name: Phone UI + public link
        run: |
          export PATH="$SDK/platform-tools:$ANDROID_HOME/platform-tools:$PATH"
          which adb
          adb start-server
          (cd ws-scrcpy/dist && nohup node index.js > "$GITHUB_WORKSPACE/ws.log" 2>&1 &)
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/8000) 2>/dev/null && break; sleep 1; done
          tail -n 5 ws.log || true
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          HOST=${URL#https://}
          LINK="$URL/#!action=stream&udid=emulator-5554&player=mse&ws=wss%3A%2F%2F$HOST%2F%3Faction%3Dproxy-adb%26remote%3Dtcp%253A8886%26udid%3Demulator-5554"
          echo "LINK: $LINK"
          printf '### Android link\n%s\n' "$LINK" >> "$GITHUB_STEP_SUMMARY"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**Phone link (touch):** $LINK

          Device list (if the link above does not open the screen): $URL/

          Started: $(date -u). Auto-restarts before the 6h limit."

      - name: Debug reporter (posts device + stream state to issue comment)
        run: |
          cat > dbg.sh <<'EOF'
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "debug starting" >/dev/null 2>&1
          for n in $(seq 1 20); do
            {
              echo "### debug $n $(date -u)"
              echo '```'
              adb devices | tail -n +2
              adb shell dumpsys power | grep -i -m3 "wakefulness"
              adb shell dumpsys window | grep -m2 "mCurrentFocus\|mFocusedApp"
              adb shell wm size
              echo "nproc=$(nproc) $(uptime)"; ls -l /dev/kvm; grep -i -m3 "kvm\|accel\|hax" emu.log
              echo "--- host top"; top -bn1 | head -n 12 | tail -n 6 | cut -c1-110
              echo "--- device top"; adb shell top -b -n 1 -m 6 | tail -n 8 | cut -c1-110
              adb shell getprop ro.build.version.sdk
              echo "abilist=$(adb shell getprop ro.product.cpu.abilist) abi=$(adb shell getprop ro.product.cpu.abi) zygote=$(adb shell getprop ro.zygote) uname=$(adb shell uname -m)"
              adb exec-out screencap -p > s.png 2>/dev/null
              ls -l s.png | awk '{print "screencap bytes", $5}'
              (convert s.png -format "mean=%[fx:mean]" info: 2>&1 || echo no-imagemagick) | head -c 200; echo
              adb shell ps -A | grep -i "scrcpy\|app_process" | head -3
              echo "--- ws.log"
              tail -n 25 ws.log | cut -c1-220
              echo '```'
            } > dbg.md 2>&1
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --edit-last --body-file dbg.md >/dev/null 2>&1 || gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file dbg.md >/dev/null 2>&1
            sleep 45
          done
          EOF
          nohup bash dbg.sh > dbg.out 2>&1 &

      - name: Keep alive (restarts itself before 6h limit)
        run: |
          export PATH="$SDK/platform-tools:$PATH"
          DISPATCH=$((START + 330*60)); END=$((START + 354*60)); SENT=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ "$SENT" = 0 ] && [ "$(date +%s)" -ge "$DISPATCH" ]; then
              gh workflow run android.yml --repo "$GITHUB_REPOSITORY" && SENT=1
            fi
            adb get-state >/dev/null 2>&1 || { echo "emulator died"; break; }
            sleep 30
          done
          [ "$SENT" = 0 ] && gh workflow run android.yml --repo "$GITHUB_REPOSITORY"
          echo done
